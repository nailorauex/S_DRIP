<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>nailora_uex - متجر الأظافر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #fef7f2 0%, #fae6dc 100%);
            color: #2d2a2a;
            padding-bottom: 80px;
        }

        /* تزيين شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f0e0d6;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b45f3b;
            border-radius: 10px;
        }

        /* الهيدر الثابت */
        .header {
            background: rgba(255, 240, 232, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #ffe0d4;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #b45f3b, #e6a17a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* شريط البحث */
        .search-bar {
            padding: 0.5rem;
            text-align: center;
            background: #fff5ef;
            border-bottom: 1px solid #ffe0d4;
        }
        .search-bar input {
            width: 90%;
            padding: 0.7rem;
            border: 1px solid #f0d5c8;
            border-radius: 50px;
            background: white;
            font-size: 0.9rem;
        }

        .products-container {
            max-width: 1200px;
            margin: 1rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
        }

        .product-info {
            padding: 1rem;
        }

        .product-title {
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .product-desc {
            font-size: 0.7rem;
            color: #a58c7a;
        }

        .price {
            font-weight: 800;
            font-size: 1.3rem;
            color: #b45f3b;
            margin: 0.5rem 0;
        }

        .add-to-cart {
            background: #b45f3b;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 50px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-to-cart:hover {
            background: #9a4e2e;
        }

        /* تأثير اللمعان على زر الطلب */
        @keyframes glow {
            0% { box-shadow: 0 0 5px #b45f3b; }
            50% { box-shadow: 0 0 20px #e6a17a; }
            100% { box-shadow: 0 0 5px #b45f3b; }
        }
        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 1rem;
            animation: glow 1.5s infinite;
        }

        /* السلة الجانبية */
        .cart-icon {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #b45f3b;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            color: white;
            font-size: 24px;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 90%;
            max-width: 350px;
            height: 100%;
            background: white;
            z-index: 1200;
            transition: 0.3s;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .cart-sidebar.open {
            left: 0;
        }
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1100;
            visibility: hidden;
        }
        .cart-overlay.show {
            visibility: visible;
        }

        /* نموذج الطلب المتكامل */
        .order-form {
            background: #f9f0ea;
            padding: 1rem;
            border-radius: 20px;
            margin-top: 1rem;
        }
        .order-form input, .order-form select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #f0d5c8;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.7rem;
            color: #bc9a84;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        footer a {
            color: #b45f3b;
            text-decoration: none;
        }

        .empty-cart {
            text-align: center;
            color: #b1a088;
            margin: 2rem 0;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">nailora<span>_uex</span></div>
</div>

<div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔍 ابحثي عن منتج... (مجموعة أظافر 1/9)">
</div>

<div class="products-container" id="productsContainer"></div>

<button class="cart-icon" id="cartIcon">🛒 <span id="cartCount">0</span></button>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-sidebar" id="cartSidebar">
    <div style="display: flex; justify-content: space-between;">
        <h3>🛍️ سلة التسوق</h3>
        <button id="closeCart" style="background:none; border:none; font-size:24px;">✖</button>
    </div>
    <div class="cart-items" id="cartItemsList" style="flex:1; overflow-y:auto;"></div>
    <div id="cartTotalPrice" style="font-weight: bold; margin: 10px 0;">المجموع: 0 د.م</div>
    
    <!-- نموذج الطلب المتكامل -->
    <div class="order-form">
        <input type="text" id="fullName" placeholder="👤 الاسم الكامل">
        <input type="tel" id="phoneNumber" placeholder="📞 رقم الهاتف">
        <select id="city">
            <option value="">🏙️ اختر المدينة</option>
            <option>الرباط</option>
            <option>سلا</option>
            <option>القنيطرة</option>
            <option>الدار البيضاء</option>
            <option>مراكش</option>
            <option>طنجة</option>
            <option>أخرى</option>
        </select>
        <input type="text" id="address" placeholder="📍 العنوان الكامل">
        <button class="whatsapp-btn" id="sendOrderBtn">📲 إرسال الطلب عبر واتساب</button>
    </div>
</div>

<footer>
    <a href="https://wa.me/212679671847" target="_blank">📞 واتساب</a>
    <a href="https://www.instagram.com/nailora_uex" target="_blank">📷 إنستغرام</a>
</footer>

<script>
    const products = [
        { id: 1, name: "مجموعة أظافر 1/9", desc: "25 قطعة - Couleur - جودة عالية", price: 79, img: "https://i.ibb.co/sdfX3DTx/IMG-20260604-WA0001.jpg" },
        { id: 2, name: "مجموعة أظافر 2/9", desc: "25 قطعة - موديل عصري", price: 79, img: "https://i.ibb.co/tM7SX4gZ/IMG-20260604-WA0002.jpg" },
        { id: 3, name: "مجموعة أظافر 3/9", desc: "25 قطعة - ألوان طبيعية", price: 79, img: "https://i.ibb.co/0pPdhd82/IMG-20260604-WA0003.jpg" },
        { id: 4, name: "مجموعة أظافر 4/9", desc: "25 قطعة - Ensemble nude", price: 79, img: "https://i.ibb.co/pBPfHZLH/IMG-20260604-WA0004.jpg" },
        { id: 5, name: "مجموعة أظافر 5/9", desc: "25 قطعة - توصيل مجاني", price: 79, img: "https://i.ibb.co/chns0V8D/IMG-20260604-WA0005.jpg" },
        { id: 6, name: "مجموعة أظافر 6/9", desc: "25 قطعة - ألوان متنوعة", price: 79, img: "https://i.ibb.co/3y94Lcf3/IMG-20260604-WA0006.jpg" },
        { id: 7, name: "مجموعة أظافر 7/9", desc: "25 قطعة - تصميم راقي", price: 79, img: "https://i.ibb.co/n8gNVqnp/IMG-20260604-WA0007.jpg" },
        { id: 8, name: "مجموعة أظافر 8/9", desc: "25 قطعة - ألوان جميلة", price: 79, img: "https://i.ibb.co/gFMb7Dzj/IMG-20260604-WA0008.jpg" },
        { id: 9, name: "مجموعة أظافر 9/9", desc: "25 قطعة - أفضل جودة", price: 79, img: "https://i.ibb.co/5xwTmtVs/IMG-20260604-WA0009.jpg" }
    ];

    const WHATSAPP_NUMBER = "212679671847";
    let cart = [];

    // عرض المنتجات مع شريط البحث
    function renderProducts(filter = "") {
        const container = document.getElementById('productsContainer');
        const filtered = products.filter(p => p.name.includes(filter) || p.desc.includes(filter));
        container.innerHTML = '';
        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img class="product-img" src="${p.img}" alt="${p.name}">
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div class="price">✨ ${p.price} د.م</div>
                    <button class="add-to-cart" data-id="${p.id}">➕ أضف إلى السلة</button>
                </div>
            `;
            container.appendChild(card);
        });
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.add-to-cart').forEach(btn => {
            btn.onclick = () => {
                const id = parseInt(btn.dataset.id);
                addToCart(id);
            };
        });
        document.querySelectorAll('.product-img').forEach(img => {
            img.onclick = () => openImageModal(img.src);
        });
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const existing = cart.find(i => i.id === id);
        if (existing) existing.quantity++;
        else cart.push({ ...product, quantity: 1 });
        updateCartUI();
        openCartSidebar();
    }

    function updateCartUI() {
        const cartCount = document.getElementById('cartCount');
        const cartItems = document.getElementById('cartItemsList');
        const totalSpan = document.getElementById('cartTotalPrice');
        const totalItems = cart.reduce((s, i) => s + i.quantity, 0);
        cartCount.innerText = totalItems;

        if (cart.length === 0) {
            cartItems.innerHTML = '<div class="empty-cart">السلة فارغة 💅</div>';
            totalSpan.innerText = 'المجموع: 0 د.م';
            return;
        }

        let total = 0;
        cartItems.innerHTML = '';
        cart.forEach(item => {
            total += item.price * item.quantity;
            cartItems.innerHTML += `
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <img src="${item.img}" width="50" style="border-radius:12px;">
                    <div style="flex:1">
                        <b>${item.name}</b><br>
                        ${item.price} د.م × ${item.quantity}
                        <div>
                            <button class="qty-minus" data-id="${item.id}">➖</button>
                            <button class="qty-plus" data-id="${item.id}">➕</button>
                            <button class="remove-item" data-id="${item.id}">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        });
        totalSpan.innerText = `المجموع: ${total} د.م`;

        document.querySelectorAll('.qty-minus').forEach(btn => {
            btn.onclick = () => changeQuantity(parseInt(btn.dataset.id), -1);
        });
        document.querySelectorAll('.qty-plus').forEach(btn => {
            btn.onclick = () => changeQuantity(parseInt(btn.dataset.id), 1);
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.onclick = () => removeFromCart(parseInt(btn.dataset.id));
        });
    }

    function changeQuantity(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.quantity += delta;
            if (item.quantity <= 0) removeFromCart(id);
            else updateCartUI();
        }
    }

    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
    }

    function openCartSidebar() {
        document.getElementById('cartSidebar').classList.add('open');
        document.getElementById('cartOverlay').classList.add('show');
    }

    function closeCartSidebar() {
        document.getElementById('cartSidebar').classList.remove('open');
        document.getElementById('cartOverlay').classList.remove('show');
    }

    // إرسال طلب منظم عبر واتساب مع نموذج البيانات
    function sendOrder() {
        if (cart.length === 0) {
            alert("⚠️ السلة فارغة! أضيفي منتجات أولاً.");
            return;
        }
        const name = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phoneNumber').value.trim();
        const city = document.getElementById('city').value;
        const address = document.getElementById('address').value.trim();

        if (!name || !phone || !city || !address) {
            alert("📝 الرجاء ملء جميع بيانات الطلب (الاسم، الهاتف، المدينة، العنوان).");
            return;
        }

        let message = `🛍️ *طلب جديد من nailora_uex*%0A`;
        message += `👤 *الاسم:* ${name}%0A`;
        message += `📞 *الهاتف:* ${phone}%0A`;
        message += `🏙️ *المدينة:* ${city}%0A`;
        message += `📍 *العنوان:* ${address}%0A`;
        message += `🛒 *المنتجات:*%0A`;
        let total = 0;
        cart.forEach(item => {
            message += `✓ ${item.name} - الكمية: ${item.quantity} - ${item.price * item.quantity} د.م%0A`;
            total += item.price * item.quantity;
        });
        message += `💲 *الإجمالي:* ${total} د.م%0A`;
        message += `🕊️ *شكراً لتسوقك من nailora_uex*`;

        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
    }

    // البحث المباشر
    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderProducts(e.target.value);
    });

    document.getElementById('cartIcon').addEventListener('click', openCartSidebar);
    document.getElementById('closeCart').addEventListener('click', closeCartSidebar);
    document.getElementById('cartOverlay').addEventListener('click', closeCartSidebar);
    document.getElementById('sendOrderBtn').addEventListener('click', sendOrder);

    function openImageModal(src) {
        let modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = 0;
        modal.style.left = 0;
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.background = 'rgba(0,0,0,0.9)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.zIndex = 2000;
        modal.innerHTML = `<img src="${src}" style="max-width:90%; max-height:90%; border-radius:20px;">`;
        modal.onclick = () => modal.remove();
        document.body.appendChild(modal);
    }

    renderProducts();
    updateCartUI();
</script>
</body>
</html>
